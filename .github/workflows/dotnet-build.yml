name: .NET Build Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # Executes every hour

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x' # Replace with the desired version

      # Navigate to the project directory (update 'project-directory' as needed)
      - name: Change directory to project folder
        run: cd .github/workflows/dotnet-build.yml # Replace with the actual path to your project

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build the project
      - name: Build project
        run: dotnet build --configuration Release

      # Custom script to list output files
      - name: Custom script - List build output
        run: |
          echo "Listing generated files in the output folder:"
          ls -la ./bin/Release