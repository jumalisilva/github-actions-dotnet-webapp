name: .NET Build Workflow

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # Executa a cada hora

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # Configuração do .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'

      # Restaurar dependências
      - name: Restore dependencies
        run: dotnet restore ./github4women/github4women.csproj

      # Compilar o projeto
      - name: Build project
        run: dotnet build ./github4women/github4women.csproj --configuration Release

      # Script personalizado para verificar arquivos gerados
      - name: Custom script - List build output
        run: |
          echo "Listando arquivos gerados na pasta de saída:"
          ls -la ./github4women/bin/Release/net8.0